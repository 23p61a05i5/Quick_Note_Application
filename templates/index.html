<!doctype html><html><head><meta charset="utf-8"><title>Quick Notes</title><link rel="stylesheet" href="{{url_for('static',filename='css/main.css')}}"></head><body><main><h1>Quick Notes</h1><p class="muted">Write, save, and search notes with Flask and SQLite.</p><section class="panel"><h2>Create a note</h2><form method="post"><label>Title<input name="title" required maxlength="120"></label><label>Note<textarea name="body" required></textarea></label><button>Save note</button></form></section><form class="search" method="get"><input name="q" value="{{q}}" placeholder="Search saved notes"><button>Search</button><a href="/">Clear</a></form><h2>Saved notes</h2><div class="grid">{% for n in notes %}<article><h3>{{n.title}}</h3><p>{{n.body}}</p><small>{{n.created_at}}</small><form method="post" action="{{url_for('delete',note_id=n.id)}}"><button class="danger">Delete</button></form></article>{% else %}<p>No notes found.</p>{% endfor %}</div></main></body></html>
